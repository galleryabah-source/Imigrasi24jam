name: Imigrasi24jam Docker Server Config

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: imigrasi24-server-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate self-hosted compose
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder-token
        run: |
          docker compose -f docker-compose.server.yml config
          docker compose -f docker-compose.server.yml --profile migration config
          docker compose -f docker-compose.server.yml --profile tunnel config
