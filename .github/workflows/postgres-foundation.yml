name: Imigrasi24jam PostgreSQL Foundation

on:
  push:
    branches: [phase0-runtime-foundation-2026-08-27]
  pull_request:
  workflow_dispatch:

concurrency:
  group: imigrasi24-postgres-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imigrasi24jam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imigrasi24jam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imigrasi24jam_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run verify:migrations
      - run: npm run check
      - run: npm run migrate:test
      - run: npm run test:db
